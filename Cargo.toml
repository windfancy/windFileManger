[package]
name = "windFileManger"
version = "0.1.0"
edition = "2024"
description = "windFileManger - 平铺式导航的轻量文件管理器"

[dependencies]
slint = "1.13.1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# windSAkinfe 瑞士军刀（全自研压缩/哈希算法，零算法第三方依赖）：
# 直接以库形态复用其 zip/tar/gz/xz/7z 归档与 CRC/MD5/SHA/BLAKE 哈希
windsakinfe = { path = "windSAkinfe" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
] }
# WebDAV/DLNA 的 HTTPS：rustls（ring 后端，免 cmake）+ 全信任证书校验器（NAS 自签证书）
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

[dev-dependencies]
# 快捷键焦点链实证：Slint 官方测试后端（仅 dev-dependency，本地测试用，不分发）
i-slint-backend-testing = { version = "1.18", features = ["internal"] }

[build-dependencies]
slint-build = "1.13.1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
